[package]
name = "isyer"
version = "1.0.0"
description = "İşyer Mobil ve Masaüstü Uygulaması"
authors = ["İşyer"]
edition = "2021"

[lib]
name = "isyer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

