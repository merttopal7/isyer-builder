name: Build Desktop (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Hangi uygulama derlensin? (app = İşletme Paneli, my = Üye Uygulaması)"
        required: true
        default: "app"
        type: choice
        options:
          - app
          - my
  push:
    branches:
      - main

jobs:
  build-desktop:
    name: Desktop (${{ matrix.os }} - ${{ inputs.target || 'app' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15
            platform: macos

    runs-on: ${{ matrix.os }}
    env:
      TAURI_TARGET: ${{ inputs.target || 'app' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies & configure target
        shell: bash
        run: |
          npm install
          node scripts/configure-target.mjs "$TAURI_TARGET"
          npx tauri icon icon-source.png

      - name: Build Tauri Desktop App
        shell: bash
        run: npx tauri build

      - name: Upload Windows Installers (.exe & .msi)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: isyer-desktop-windows-${{ inputs.target || 'app' }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload macOS Installer (.dmg)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: isyer-desktop-macos-${{ inputs.target || 'app' }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

